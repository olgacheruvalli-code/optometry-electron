<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Optometry MIS</title>
    <link rel="manifest" href="./manifest.json" />
    
    <!-- iOS / Safari PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Optometry" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="./icon.png" />

    <!-- Android / Chrome / Windows PWA support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Optometry" />
    <meta name="theme-color" content="#070b14" />
    
    <!-- Viewport for full edge-to-edge mobile app screen -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #070b14;
        -webkit-tap-highlight-color: transparent;
      }
      /* Safe area insets for notched phones & bottom home bar */
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
      }
    </style>
    <script>
      // Define `global` for compatibility with some Node-style libraries
      if (typeof global === 'undefined') {
        window.global = window;
      }
    </script>
    <script>window.__API_BASE__="https://optometry-backend-iiuk.onrender.com";</script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
